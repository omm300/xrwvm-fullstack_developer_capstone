
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-python-files:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python linter
        run: python -m pip install pylint

      - name: Lint Python Files
        run: pylint --exit-zero server/djangoapp/*.py

      - name: Post Python lint results
        if: always()
        run: echo "Python lint job completed"

  lint-javascript-files:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JavaScript linter
        run: npm install --no-save eslint@8.57.1

      - name: Lint JavaScript Files
        run: >-
          npx eslint --no-eslintrc
          --env browser,es2021,node
          --parser-options '{"ecmaVersion":"latest","sourceType":"module","ecmaFeatures":{"jsx":true}}'
          --rule 'no-undef:warn'
          --rule 'no-unused-vars:off'
          "server/frontend/src/**/*.{js,jsx}"

      - name: Post JavaScript lint results
        if: always()
        run: echo "JavaScript lint job completed"
